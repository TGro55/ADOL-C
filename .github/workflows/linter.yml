name: Run Clang-tidy Check

on:
    push:
      branches: [ "master" ]
    pull_request:
      branches: [ "master" ]

jobs:
  clang-tidy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Clang-Tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-14

      # this step is required because we need the context of the package like include paths
      - name: Configure with CMake
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug -DBUILD_INTERFACE=ON

      - name: Run Clang-Tidy
        run: |
          clang-tidy-14 --version
          git fetch origin master
          git diff --name-only -z origin/master...HEAD -- '*.cpp' '*.h' |
            xargs -0 -r clang-tidy-14 -p build --warnings-as-errors='*' --quiet
