name: Benchmark comparison

on:
  push:
    branches:
      - Benchmark

  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    outputs:
      comparison_verdict: ${{ steps.compare.outputs.comparison}}

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          path: master

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Build current branch
        run: |
          cmake -S current -B build-current \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/install-current

          cmake --build build-current -j$(nproc)
          cmake --install build-current

      - name: Build master branch
        run: |
          cmake -S master -B build-master \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/install-master

          cmake --build build-master -j$(nproc)
          cmake --install build-master

      - name: Build benchmark against current branch
        run: |
          g++ current/ADOL-C/benchmark/benchmark.cpp \
            -std=c++20 \
            -Iinstall-current/include \
            -Linstall-current/lib \
            -Wl,-rpath,$PWD/install-current/lib \
            -ladolc \
            -o benchmark-current

      - name: Build benchmark against master
        run: |
          g++ current/ADOL-C/benchmark/benchmark.cpp \
            -std=c++20 \
            -Iinstall-master/include \
            -Linstall-master/lib \
            -Wl,-rpath,$PWD/install-master/lib \
            -ladolc \
            -o benchmark-master
        
      - name: Build benchmark comparator
        run: |
          g++ current/ADOL-C/benchmark/compareBenchmarks.cpp \
            -std=c++20 \
            -o compareBenchmarks 

      - name: Run current benchmark
        run: |
          echo "===== Current branch ====="
          ./benchmark-current -o current_branch.txt

      - name: Run master benchmark
        run: |
          echo "===== Master branch ====="
          ./benchmark-master -o master_branch.txt
      
      - name: Compare Benchmarks
        id: compare
        run: |
          set +e

          ./compareBenchmarks \
          -baseline master_branch.txt \
          -update current_branch.txt

          comparison=$?

          echo "comparison=$comparison" >> "$GITHUB_OUTPUT"

          exit 0
        
      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison-result
          path: master_branch_compared_to_current_branch.md
          retention-days: 7

  print-Results:
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Get Comparison Table
        uses: actions/download-artifact@v4
        with:
          name: benchmark-comparison-result
      - name: Print Comparison Table
        uses: mshick/add-pr-comment@v3
        if: always()
        with:
          message-path: |
            master_branch_compared_to_current_branch.md
  
  check-verdict:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check verdict
        if: needs.benchmark.outputs.comparison_verdict == '1'
        run: |
          echo "Benchmark comparison failed. Please check the results."
          exit 1
